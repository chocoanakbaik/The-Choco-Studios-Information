<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b14">
  <meta name="robots" content="noindex,follow">
  <meta name="description" content="Halaman yang dicari tidak tersedia di The Choco Studios.">
  <title>404 — Halaman Tidak Ditemukan | The Choco Studios</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root { color-scheme: dark; --bg: #080b14; --panel: #111625; --text: #eef2ff; --muted: #a0aac2; --blue: #638cff; --purple: #a16bff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 0%, #171d35 0%, var(--bg) 62%); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 640px); padding: clamp(28px, 7vw, 56px); text-align: center; border: 1px solid #2a3249; border-radius: 24px; background: rgba(17, 22, 37, .9); box-shadow: 0 24px 80px rgba(0, 0, 0, .28); }
    .brand { display: inline-flex; align-items: center; gap: 11px; margin-bottom: 36px; text-align: left; }
    .mark { display: grid; width: 44px; height: 44px; place-items: center; border: 1px solid #343d5b; border-radius: 13px; background: #0b1020; color: #a5b8ff; font-weight: 850; letter-spacing: -1px; }
    .brand-name { display: block; font-weight: 750; letter-spacing: -.3px; }
    .brand-sub { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
    .code { margin: 0; background: linear-gradient(115deg, var(--blue), var(--purple)); background-clip: text; color: transparent; font-size: clamp(76px, 18vw, 124px); font-weight: 850; letter-spacing: -.08em; line-height: 1; }
    h1 { margin: 20px 0 12px; font-size: clamp(25px, 4vw, 34px); letter-spacing: -.7px; }
    p { max-width: 430px; margin: 0 auto; color: var(--muted); line-height: 1.8; }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
    a { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 0 18px; border: 1px solid #38435f; border-radius: 12px; color: var(--text); text-decoration: none; font-weight: 650; }
    a.primary { border-color: transparent; background: linear-gradient(115deg, #648bff, #a76cff); color: #080b14; }
    a:focus-visible { outline: 2px solid #b9c8ff; outline-offset: 4px; }
    .footnote { margin-top: 28px; font-size: 13px; }
    @media (prefers-reduced-motion: no-preference) { main { animation: enter .35s ease-out both; } @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } } }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="The Choco Studios, kembali ke beranda" style="text-decoration:none">
      <span class="mark" aria-hidden="true">TCS</span>
      <span><span class="brand-name">The Choco Studios</span><span class="brand-sub">Pusat Informasi</span></span>
    </a>
    <p class="code" aria-label="Error 404">404</p>
    <h1>Halaman tidak ditemukan</h1>
    <p>Tautan yang dibuka mungkin sudah berubah, salah alamat, atau halaman tersebut memang belum tersedia.</p>
    <div class="actions">
      <a class="primary" href="/">Kembali ke beranda</a>
      <a href="mailto:thechocostudio@gmail.com?subject=Laporkan%20tautan%20rusak">Laporkan tautan rusak</a>
    </div>
    <p class="footnote">The Choco Studios · Pusat Informasi</p>
  </main>
</body>
</html>
